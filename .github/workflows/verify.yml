name: Verify Pyrograph integration

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test backend and offline operations
        run: |
          python -m unittest -q
          python -m scripts.rehearse_demo > /tmp/pyrograph-rehearsal.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Validate and build frontend
        run: |
          node --test frontend/tests/outlook.test.mjs frontend/tests/outlook-source.test.mjs
          npm --prefix frontend run build:vercel
      - name: Build and smoke-test production image
        run: python -m scripts.smoke_image
